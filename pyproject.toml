[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-wifi"
version = "0.1.0"
description = "A small website that lists cafes with wifi and power sockets for remote working (Udemy 100 Days of Code, day 88)."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
keywords = ["cafe", "wifi", "sqlite", "wsgi", "udemy", "100-days-of-code"]
# No runtime dependencies: the site uses the standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
